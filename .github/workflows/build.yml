name: build

# 変更のたびにビルドと自己診断を通し、タグを打ったときだけリリースへ成果物を添付する。
# 配布物が手元ではなくリポジトリから作られていることを、履歴として残すのが目的。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # タグを打ったときにリリースへ添付するため、この一段だけ書き込みが要る。
      contents: write

    steps:
      - name: ソースを取得
        uses: actions/checkout@v4

      - name: .NET SDK を用意
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: バージョンを読み取る
        id: version
        shell: pwsh
        run: |
          [xml]$proj = Get-Content src/OtpManager.csproj
          $version = ($proj.Project.PropertyGroup.Version | Where-Object { $_ })[0]
          Write-Host "version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: ビルド
        shell: pwsh
        run: dotnet build -c Release src/OtpManager.csproj --nologo

      - name: 自己診断
        shell: pwsh
        run: |
          $exe = "src/bin/Release/net10.0-windows/OtpManager.exe"

          # WinExe なので PowerShell は既定で完了を待たない。待たせたうえで終了コードを見る。
          $log = Join-Path $env:RUNNER_TEMP "selftest.txt"
          $p = Start-Process -FilePath $exe -ArgumentList '--selftest' -NoNewWindow -Wait -PassThru `
                             -RedirectStandardOutput $log
          Get-Content $log
          if ($p.ExitCode -ne 0) {
            Write-Error "自己診断に失敗しました (exit $($p.ExitCode))"
            exit 1
          }

      - name: インストーラをビルド
        shell: pwsh
        run: |
          # ネイティブ AOT が MSVC のリンカを探すのに vswhere を使う。
          $installer = "C:\Program Files (x86)\Microsoft Visual Studio\Installer"
          if (Test-Path $installer) { $env:PATH = "$env:PATH;$installer" }
          python tools/build_release.py

      - name: ハッシュを求める
        id: hash
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/OtpManagerSetup.exe -Algorithm SHA256).Hash.ToLower()
          $size = (Get-Item dist/OtpManagerSetup.exe).Length
          Write-Host "sha256: $hash"
          Write-Host "size  : $size"
          "sha256=$hash" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: 成果物を残す
        uses: actions/upload-artifact@v4
        with:
          name: OtpManagerSetup-${{ steps.version.outputs.version }}
          path: dist/OtpManagerSetup.exe
          if-no-files-found: error

      - name: リリースへ添付
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $hash = "${{ steps.hash.outputs.sha256 }}"

          # 行の配列で組み立てる。ヒアドキュメントは閉じ記号を行頭に置く必要があり、
          # YAML のブロックスカラーの中では書けない。
          $notesFile = Join-Path $env:RUNNER_TEMP "notes.md"
          Set-Content -Path $notesFile -Encoding utf8 -Value @(
            "このファイルは GitHub Actions がこのタグのソースからビルドしたものです。",
            "",
            "OtpManagerSetup.exe",
            "SHA-256: $hash",
            "",
            "このアプリにはコード署名がありません。初回実行時に SmartScreen の警告が出ますが、",
            "「詳細情報」から実行できます。上のハッシュと照合すれば、配布物が改ざんされていないことを確認できます。"
          )

          gh release view $tag --repo $env:GITHUB_REPOSITORY > $null 2>&1
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/OtpManagerSetup.exe --repo $env:GITHUB_REPOSITORY --clobber
          } else {
            gh release create $tag dist/OtpManagerSetup.exe --repo $env:GITHUB_REPOSITORY --title $tag --notes-file $notesFile
          }
